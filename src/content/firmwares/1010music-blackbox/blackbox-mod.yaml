homepage: https://justinjoe.com/blackbox-mod
distribution: patch-your-own
requires_stock: 3.1.9
install_notes: >-
  Download Blackbox 3.1.9 from 1010music, then patch BLACKBOX.bin in the browser
  patcher or with apply.py; the patcher checks the file's SHA-256 and only
  accepts 3.1.9. Copy both output files, BLACKBOX.bin and BBEXTRA.BIN, to the
  root of the microSD card and install as for any official update (hold BACK and
  INFO at power-on). The unit restarts once on first boot while the second file
  installs. Keep the stock file to go back. Coming from JOEBOX 1, copy both
  files, because the second one changed. Early JOEBOX 1 builds left some
  units restarting at the logo; the 2026-10-17 build fixed that, and the author
  says it was tested on few units.
brick_risk: false
