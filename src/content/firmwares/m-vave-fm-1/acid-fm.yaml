distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer in Chrome or Edge over USB. The README asks you to back up the full flash first,
  for example with MvaveFM1Unbricker, and notes that the ROM bootloader cannot be overwritten, so a failed
  install can be recovered. Inherits JIANT FM's brick risk.
