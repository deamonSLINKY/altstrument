device: m-vave-fm-1
name: ACID FM
summary: >-
  Fork of JIANT FM aimed at IDM and braindance: its README is at 0.6, with trimmed engines, an acid-coloured screen
  theme on every page and IDM genres in the song generator; chopped breaks and tape effects are still planned.
description: >-
  Fork of JIANT FM, which is itself a Felucca fork using SLOOP's song system, so it keeps JIANT's engines,
  sequencer, browser installer, editor and emulator. The README lists the work in steps: 0.2 trimmed the engines
  and set aside 128 KiB of flash for breakbeats, 0.3 brought one acid palette, a home screen with TRACKS, VISUAL and
  GEN views and a new splash, 0.4 redrew the sound sections (EDIT, ENV, ARP, SCL, LFO, FX) in that look, narrowed
  the generator to ten IDM genres and added a short demo that plays at power-on, 0.5 redrew SEQ, GLO and a new MIDI
  page (per-track MIDI in, out and channel, clock source and clock out) in the same look, and 0.5.1 retuned the
  genre names, tempo ranges and swing, replaced BROKEN BEAT and DRIFT with GLITCH HOP and AMB TECHNO, and made an
  external clock hold a steady tempo, and 0.5.2 fixed harsh glitches on some generated songs by budgeting the
  long delay against the processor load and falling back to its short mode under overload, and 0.6 redrew SAVE
  (SOUND, SONG, PROJECT and MORE), the menu and the confirmation dialogs in the same look, and added PLAYS, which
  lets a track play only on some loops. Still planned are loading and chopping your own breakbeats from the web
  page, tape and 303-style accent and slide effects, new voices and further song-generator styles. No release is tagged yet, so the version below is a commit. The
  repository includes a browser emulator and a manual site.
