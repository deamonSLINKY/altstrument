device: m-vave-fm-1
name: CHOPPAH
summary: >-
  Breakbeat chopper for the FM-1: a recorded Amen break cut into sixteen slices on the white keys, momentary effect
  pads on the black keys, a pattern generator, a soundboard of sound-system effects and a DJ filter.
description: >-
  Built on charlesvestal's fm1-base, with Felucca's board support code underneath. Seventeen breaks are selectable
  on the ALGORITHM knob: five are played by a small drum synth and twelve are recorded two-bar Amen loops stored in the
  firmware as ADPCM. Holding a slice loops it and the four knobs set its length, pitch, start and mode. The black-key
  pads cover rolls, reverse, freeze, tape stop, gate, random, a filter throw and a dub delay. The generator rearranges
  the break as it plays, the soundboard fires sixteen synthesized effects such as horns and sirens, and the FX page
  adds ring modulator, high-pass, flanger and degrader. MIDI clock in and out and Bluetooth MIDI are included. The
  README calls it an early 0.x release: saved patterns, a step sequencer, a looper and loading your own breaks are
  planned. A browser emulator and a manual are published on the project site.
status: active
authors:
- name: Laurens Profittlich (profikid)
  url: https://github.com/profikid
source: https://github.com/profikid/fm1-break-choppah
