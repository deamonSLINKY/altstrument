  url: https://github.com/fantasmogenesis
source: https://github.com/fantasmogenesis/fntsmg-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0 like Felucca and the LICENSE file is the GPL v3 text with no "or later" grant. The README
  says the sample bank belongs to fantasmogenesis or is generated by the engines and ships under the same licence; the
  bank's list (firmware/samples/banco.json) names pack folders of a personal sample library as the source of 18
  samples. The Manrope font is SIL OFL 1.1. A note in the repository (motores/PORTABILIDAD.md) says the author may
  later move the engines to a separate private repository under proprietary terms; this repository's code is
  GPL-3.0.
homepage: https://fantasmogenesis.art/fm1/guia
distribution: source-only
requires_stock: M-VAVE stock firmware or Felucca
install_notes: >-
  The README names the author's web installer, a beta at fantasmogenesis.art/fm1/instalar whose page code asks for an
  invitation code, and Felucca's fm1_install.py for installing the built package. To build it, clone with
  submodules (the Felucca fork on its groovebox branch) and run firmware/build.sh mt, after pointing the paths in build.sh
  at your JieLi toolchain and AC79 SDK. The README says installing third-party firmware is at your own risk, that you should
  back up your projects, and that M-VAVE's Workbench puts the stock firmware back.
brick_risk: true
