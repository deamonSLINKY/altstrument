device: m-vave-fm-1
name: Braindancer
summary: >-
  IDM and braindance firmware on JIANT FM (formerly ACID FM): acid-coloured UI, ten IDM genres in the song
  generator, a TAPE master effect, a 303-style accent and slide response, and new presets and drum kits.
description: >-
  Renamed from ACID FM in the 0.7 build, with the same author and a new repository; the old acid-fm repository now only forwards
  links. It is a fork of JIANT FM, a Felucca fork using SLOOP's song system, and keeps JIANT's engines, six-track
  sequencer, browser installer, editor and emulator. The README's version history is the work so far. 0.2 trimmed the
  engines and reserved 128 KiB of flash for breakbeats, and 0.3 to 0.6 redrew the UI in one acid palette with a
  TRACKS, VISUAL and GEN home screen, a demo that plays at power-on, a MIDI page with per-track in, out and channel
  and external clock handling, and a PLAYS option that lets a track play only on some loops. 0.8 adds TAPE, a master
  effect with wow, flutter, saturation, hiss and tone controlled by one AGE knob, which is the first thing the CPU
  safety net switches off under overload. It also adds accents that climb the cutoff and a slide that glides in
  about 58 ms without a new attack on the ANALOG, MONO and LEGATO voices, 20 more factory presets, and reworked DRUM-X
  kits (909 CLUB, 808 BOOM, LOFI DUST, TECHNO RAW and BREAKS). Loading and chopping your own breakbeats from the
  web page and further song-generator styles are listed as planned. The README names 0.8 as its status; the repository
  has no tags or releases, so the version below is a commit.
