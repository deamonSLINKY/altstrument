  url: https://github.com/jaeggerr
source: https://github.com/jaeggerr/moondaw-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only. Parts taken from Felucca keep GPL-3.0-only, the drum DSP helpers are MIT, the
  second-core code from felucca-bsp is MPL-2.0 and the band-limited step table from blip_buf is LGPL-2.1-or-later.
  The fonts are SIL OFL 1.1, and three JieLi AC79 SDK files (Apache-2.0) are read from your SDK checkout at build time.
  The name MOONDAW is reserved by the author; forks are asked to use another name.
homepage: https://moondaw.com/
distribution: source-only
install_notes: >-
  Build with ./build.sh (Docker is used if the JieLi toolchain is not installed), then install build/moondaw.fwsc
  with tools/fm1_install.py. The README warns that installing is at your own risk, says to back up the stock flash
  first and keep FM-1-transporter ready to restore it, and points to docs/ARRIVEE.md for a rescue path that needs no
  extra hardware.
brick_risk: true
