device: m-vave-fm-1
name: MOONDAW
summary: >-
  Tracker firmware: 8 tracks, up to four notes and three named effects per step, chip, sample and sung-syllable
  voices, and songs stored as plain-text .trk files that can be sent over USB. Beta, in daily use on an FM-1.
description: >-
  The arrangement has three levels: SONG lists phrases, SECTION shows what each track plays in a phrase, and PATTERN
  holds the steps. Voices are PULSE, NOISE and WAVE chip voices, SMPL for your own samples, VOX, which sings the
  syllables written into a step, and DRUM, which reuses Felucca's drum voices, followed by an envelope, a filter,
  reverb and delay sends and a master limiter. The device holds 31 songs and a mixer page sets volume, pan and
  sends per track. REC records played notes over a count-in, a MIDI keyboard on the TRS jack (or forwarded by a
  script from a computer) plays the instrument under the cursor, and on-device HELP has a page per screen and effect.
  Python tools send and fetch songs, convert WAV files into the sample bank and drive the device remotely. The
  project site has a browser build of the same firmware and a manual. This is not a fork of Felucca: it takes
  Felucca's hardware layer, drivers, update loader and build tools, and UPSTREAM.md lists each file and what was
  changed. The repository's own README describes the web installer page as living in web/installer, which has to be
  served from a build of the package; the project site links only the emulator and manual, and no package is
  released yet, so the firmware has to be built from source.
status: active
authors:
