device: m-vave-tank-mini
name: mvave-tank-mini-protocol
kind: tool
summary: Portuguese-language specification of the Tank Mini's Bluetooth LE and USB-MIDI protocol, with packet formats, checksums, block and model maps and the 92-byte preset layout.
description: >-
  A single README that documents the pedal's wire protocol for people writing their own editors or
  controllers. It gives the Bluetooth LE service and characteristic UUIDs, which carry raw bytes, and the
  USB-MIDI form, which wraps the same packets in SysEx with a 7-bit packing routine in Python. It then
  covers the packet header and checksum, the acknowledgement, preset selection across the 21 presets, the
  reordering of the six effect blocks, and the toggle, model and knob addresses of each block with the
  models and parameters of the effects. It also describes the 92-byte preset record, how to read it and how
  to write it back to flash. The author tested it on firmware TANK MINI_009 and says
  the amp and cabinet blocks hold 20 user-loadable slots. The repository contains only the README. The
  badge at the top says MIT, but there is no licence file.
