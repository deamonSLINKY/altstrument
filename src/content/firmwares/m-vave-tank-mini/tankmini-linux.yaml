distribution: source-only
install_notes: >-
  Needs GTK 4.14 and libadwaita 1.5 or newer and Rust 1.75 or newer. Clone the repository and run
  install.sh, which builds and installs the tankmini command and the tankmini-gui app under ~/.local. Your
  user needs access to the ALSA raw MIDI devices, usually through the audio group. The app writes preset
  flash, with a backup and read-back check on every write. It never sends the ERASE command and leaves
  firmware updates to M-VAVE's own tools.
brick_risk: false
