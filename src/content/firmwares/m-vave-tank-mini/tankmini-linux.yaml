device: m-vave-tank-mini
name: tankmini-linux
kind: tool
summary: Native Linux app and command-line tool for the Tank Mini that edits and backs up presets over a reverse-engineered USB-MIDI protocol, with a tuner and a protocol write-up.
description: >-
  Rights warning: the repository's assets folder holds factory-table.bin, a byte-exact dump of the pedal's
  stock factory presets, which the app uses for its factory reset. M-VAVE has not licensed that data for
  redistribution.

  A Rust workspace with a shared protocol crate, a GTK4 and libadwaita desktop app and a command-line tool.
  It reads and writes the 21 presets over USB-MIDI, shows each preset as a signal chain with every
  parameter of the six effect blocks, and edits live through the pedal's edit buffer so flash is written
  only on request. It backs up the preset table before each write and reads it back to verify, and also
  does preset export and import, local preset names, a sound library with setlists, a tuner that reads the
  pedal's USB audio input and a PipeWire script for playing along with computer audio. The author tested
  it on firmware TANK MINI_004 and marks each protocol finding in docs/protocol as verified on hardware,
  read from the official app, or inferred. IR and amp upload, remote tuning and Bluetooth are not done.
  The pedal's firmware is never touched. The interface and screenshots are in Brazilian Portuguese.
