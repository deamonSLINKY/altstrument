device: m-vave-cube-baby
name: cuvave-midi
kind: tool
summary: Rust library and two example programs that parse the Cube Baby's SysEx messages, spy on traffic between its app and the pedal, and dump its memory over USB-MIDI.
description: >-
  A small Rust crate with a parser for the pedal's SysEx messages, built with the nom library. It decodes
  and encodes the 7-bit packing, and turns frames into message types for memory read, write and content,
  name and version query, acknowledgement, erase and a few unidentified ones. It also names the
  knob parameters, the A, B and C presets and the layout of the settings block. Two examples are included.
  capture opens virtual MIDI ports to show decoded messages passing between the vendor app and the pedal,
  and mem_dump reads a chosen memory range from the pedal into a file. The README has a partial memory map
  with the settings, USB loopback flag and IR data regions in RAM and ROM. Memory dumps can contain the
  pedal's factory IRs, which belong to M-VAVE, but none are in the repository. The README does not say which
  Cube Baby variant it was tested on.
status: dormant
authors:
