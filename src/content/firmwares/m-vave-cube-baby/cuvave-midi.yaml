  url: https://github.com/pferreir
source: https://github.com/pferreir/cuvave-midi
source_status: open
license: GPL-3.0-only
license_notes: >-
  The licence file is the full GPL version 3 text. No source file carries a licence header and Cargo.toml has
  no licence field, so there is no "or any later version" notice for this program, only the standard text
  of the licence itself.
distribution: source-only
install_notes: >-
  Build with cargo from a clone of the repository; the examples use an unstable Rust feature, so a nightly
  toolchain is needed. The capture example uses virtual MIDI ports, which midir supports on Unix systems
  only. The mem_dump example only reads memory. Check any write or erase message you build yourself against
  the parser before sending it to the pedal.
brick_risk: false
