license: MIT
license_notes: >-
  The licence file is the standard MIT text, copyrighted to Marco Jardim. The example IRs are stated to be
  original designs under the same licence. M-VAVE's factory presets and IRs are not covered and are not
  included.
distribution: source-only
install_notes: >-
  Needs Python 3.11 or newer and uv; run uv sync in a clone of the repository. Tested on Windows only. Close
  other MIDI programs first, because a Windows MIDI port can be open in one process at a time. The persistent
  commands write the pedal's flash and take a backup first. Keep backups, since they hold your unit's factory
  content.
brick_risk: false
