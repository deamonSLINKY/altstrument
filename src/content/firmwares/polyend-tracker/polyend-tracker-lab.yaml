device: polyend-tracker
name: Polyend Tracker Lab
summary: >-
  Eight experimental firmwares for the original Tracker built on OpenTracker, each a different instrument: a granular
  workstation (BULUT), modular synth, pinball sequencer, clip workstation, data music, makam breaks and a Lua platform.
description: >-
  Every firmware is a separate OpenTracker tree with its own image name, manual and release image, plus a shared
  navigation layer with parameter pads, macros, modulation and MIDI learn, and a recorder that writes the master and stems
  to the card. BULUT is a granular firmware with four channels that each run Granular, Quanta, Beads or Tape engines,
  with Clouds-style effects and a sample browser. GRAF is a pad-patched modular synth with 49 modules including Plaits
  and Open303 ports. KONSOL is an eight-track clip and scene workstation with sixteen engines. FLIPPER and TILT are
  pinball-driven Markov sequencers, DATAMATICS turns files on the card into data music, MAKAM combines usul-cut
  breaks with microtonal voices, and PLATFORM runs Lua scripts and native apps from the card. The README says the
  set is a first 0.1 version that passed a simulator and QEMU test gate and has not been tested on a real Tracker.
status: active
authors:
  - name: semierendonmez-commits
    url: https://github.com/semierendonmez-commits
source: https://github.com/semierendonmez-commits/polyend-tracker-lab
source_status: open
license: Apache-2.0
license_notes: >-
  Each firmware folder has an Apache-2.0 LICENSE. BULUT's THIRD_PARTY.md says code derived from GPL-3.0 sources makes
  its image a GPL-3.0 combined work with MIT notices kept, and other folders describe GPL-3.0 ports from the author's own
  plugins, so some images may be GPL-3.0 in practice. The README notes that OpenTracker, the base, had no LICENSE file when
  it was written; upstream added an Apache-2.0 one on 2026-10-28.
distribution: download
requires_stock: Polyend stock firmware or OpenTracker; keep a stock image in /Firmware
install_notes: >-
  Copy one .ptf into /Firmware on the SD card, keeping its 24-character name, and install it from Config, Firmware update
  on stock or OpenTracker. Every lab firmware can list and install other .ptf files from its own Config, Firmware page, and
  OpenTracker's ot_restore.txt escape hatch works too. Keep only one lab image plus stock in /Firmware, since the rear reset
  button installs a random .ptf from the folder. The README says the set has not been tested on a real unit.
brick_risk: true
tags: [synth-engine, granular, sequencer, generative, sampler, platform, fork, ui]
