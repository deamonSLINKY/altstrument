device: elektron-digitone-ii
name: Digiwerk
summary: "Custom firmware for the Digitone II on OS 1.12 that adds Déjà vu and in-key LFO waves, new arp modes, a 3-band master compressor, a flanger and a tape echo, built on your Mac from your own OS file by a notarized patcher app."
description: >-
  Formerly published as dn2-cfw, a research notebook; version 0.1.0 is the first
  release under the Digiwerk name. Every build is a base plus a choice of effects
  for four slots. The base adds LFO waves after RAND: a looping run of random
  values, a version that restarts on each trig, versions that snap the loop to a
  scale, and from 0.2.0 one that follows the track's key, plus one-cycle and
  half-cycle LFO modes and the arp modes SHUF, RAND and TM, which also work on
  MIDI tracks. The effects are a three-band master compressor (CMP3), a flanger
  (FLNG) and, from 0.2.0, a tape echo (TAPE). A spring reverb (SPNG) shipped in
  0.2.0, but the author withdrew all six builds that include it (EEES, CEES, EFES,
  EETS, CFES and EFTS) on 30 Oct 2026: on a Digitone II, CFES and EFTS go silent or
  buzz within a second of starting while the screen keeps working, and the other
  four run the same spring code. The Digiwerk Patcher macOS app, or the
  digiwerk-patch command-line tool, checks that your file is Elektron's original
  OS 1.12 by hash and saves a build only if it matches the tested result; no
  Elektron firmware is included.
  tools/brickcheck runs 12 checks that each build must pass, and recovery from the
  STARTUP menu over DIN MIDI was tested on the author's unit. The Déjà vu LFO
  follows Kári Garðarsson's design for the Digitakt II. Kits saved on Digiwerk
  lose the new settings when opened on stock OS 1.12. The README says the project
  is part of Modwerk and was made with Claude.
status: active
authors:
  - name: naturarum
    url: https://github.com/naturarum
source: https://github.com/naturarum/dn2-cfw
source_status: open
license: GPL-2.0-or-later
distribution: patch-your-own
requires_stock: "1.12"
install_notes: >-
  Back up projects and the +Drive with Elektron Transfer first. Download Digiwerk
  Patcher from the release (macOS 13 or later), drop Elektron's own
  Digitone_II_OS1.12_dist.zip on it, choose the effects for each slot, and send the resulting .syx
  to the Digitone II with Transfer. Keep the original OS file, since Elektron's
  page lists only the current version and it is needed to go back. If the unit
  does not start, hold FUNC at power-on, press TRIG 4 (OS UPGRADE) and send the
  stock file over DIN MIDI. If you installed one of the withdrawn spring reverb
  builds, send another build or Elektron's Digitone_II_OS1.12.syx with Transfer.
tags: [fx, lfo, arpeggiator, compressor, delay, patcher, research]
versions:
  - version: v0.2.0
    date: 2026-10-29
    url: https://github.com/naturarum/dn2-cfw/releases/tag/v0.2.0
    notes: Adds a key-following LFO wave, one-cycle and half-cycle LFO modes, SHUF, RAND and TM arp modes that also work on MIDI tracks, a tape echo, and per-slot effect choice in the patcher. The six spring reverb builds (EEES, CEES, EFES, EETS, CFES, EFTS) were withdrawn on 30 Oct 2026; CFES and EFTS stop the sound on a Digitone II and the other four share the same spring code.
  - version: v0.1.0
    date: 2026-10-26
    url: https://github.com/naturarum/dn2-cfw/releases/tag/v0.1.0
    notes: First release. Déjà vu LFO waves in the base plus the Compressor + Flanger pack (build DJ01), with the macOS patcher app and command-line tool.
