    url: https://drive.google.com/file/d/1VujMCC0U31Wbe5HgObWU1151hk6Qmdv2/view
    notes: For rev k, l and m boards. Adds support for rev m boards and makes the tap gesture easier to trigger.
  - version: '0.911'
    url: https://drive.google.com/file/d/1zjmK1UpYfMf2xe60OEFRapgs66Jgb3b-/view
    notes: For rev k and l boards. Shipped on the 5th anniversary units. Mode 2 capture length raised to about 2.5 seconds; mode 3 feedback-head delay changes and vibrato are smoother.
  - version: 0.900 beta
    url: https://drive.google.com/open?id=1ULAGPi9ydra9Yv906VE4EjTSq5nkwoTM
    notes: For rev k and l boards. The pre-release of the nightly branch; superseded by 0.911.
