device: mutable-instruments-beads
name: Drizzlet Hygrostat
kind: tool
summary: Browser page that builds a Drizzlet update wav for Beads with your own options layout, checking the firmware image by hash and the encoded wav by decoding it again.
description: >-
  A static page with no server part. You pick a Drizzlet release, choose which
  options page features are off, fixed or adjustable and where each sits on the
  panel, and the page patches the 512-byte profile block of the release's app
  image, encodes it as a Beads update wav in the browser and decodes the result
  to check it. It estimates the processor load of the chosen features, warns
  above 91 percent and blocks above 92 percent, and draws panel guides for the
  layout. Layouts can be shared as links. It needs a Drizzlet release that
  carries a profile block, which the README describes as Beta 2 and later; the
  only entry in the manifest at the time of writing was an unreleased
  development build, and the published page was not yet live.
status: active
authors:
  - name: Insolent Construct
    url: https://github.com/insolentconstruct
source: https://github.com/insolentconstruct/hygrostat
source_status: open
license: MIT
license_notes: >-
  The JavaScript files carry an MIT notice from Insolent Construct, and the
  encoder port also credits Émilie Gillet's original. glibc_sincos.js is
  LGPL-2.1-or-later (static/js/COPYING.LIB). The repository has no top-level
  LICENSE file.
homepage: https://github.com/insolentconstruct/hygrostat#readme
distribution: source-only
requires_stock: A Drizzlet release with a profile block (Beta 2 or later)
install_notes: >-
  Serve the static folder over HTTP, for example with python3 -m http.server,
  and open it on localhost, which the hash check needs. Pick a release, set the
  layout and download the wav, then install it like any Beads update. The
  README links a GitHub Pages deployment that was not live yet. The wav is for
  Drizzlet, not for stock Beads, so see the Drizzlet entry for recovery notes.
