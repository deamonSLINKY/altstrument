device: electrosmith-daisy-patch
name: Mirth and Mirth Lite
summary: >-
  Neural amp modelling firmware for the Patch.Init that runs NAM A2-Lite captures from microSD, nineteen "not-amps"
  with one steer control each and a bank of networks trained on two hardware filters; Mirth Lite is the screenless build.
description: >-
  Mirth runs Neural Amp Modeler A2-Lite networks read from the microSD card, with input trim, dry/wet mix, bypass, an
  input peak meter and a CPU readout, at about 64 percent CPU with a capture running. The nineteen not-amps are
  captures altered inside the network, and the Filters bank holds seven networks trained on recordings of a Doepfer
  A-124 Wasp and a Behringer Swords with frequency and resonance controls. An A2 .nam file copied to the card is
  converted at the next boot. The author aims it at their dual pingable low-pass gate, whose vactrol memory
  a static curve cannot reproduce. A capture of an Orange TH100 is compiled in as a fallback, so the module works
  without a card. The starter captures, CC0 or CC BY, and the filter networks are a separate release asset. Mirth uses a 64x48 OLED; Mirth Lite
  runs on a stock unit with no screen and uses the toggle for banks. The A2 engine comes from bkshepherd's
  DaisySeedProjects.
status: active
authors:
  - name: David Baghurst (Eight4aWish)
    url: https://github.com/Eight4aWish
source: https://github.com/Eight4aWish/eurorack_daisy_patch_init/tree/main/daisy_neural
source_status: open
license: MIT
license_notes: >-
  The A2 runtime is MIT from DaisySeedProjects. The starter captures are credited individually in the repository and
  are CC0 or CC BY. The filter networks, trained on recordings of the author's own Wasp and Swords, are CC BY 4.0, and
  the random-weight not-amp files are CC0. The repository never commits captures; they ship as a release asset.
homepage: https://eight4awish.com/modules/mirth/
distribution: download
requires_stock: >-
  Daisy Patch.Init with the Daisy bootloader and a microSD card. Mirth also needs a 64x48 OLED; Mirth Lite runs on
  an unmodified unit.
install_notes: >-
  Needs the Daisy bootloader in QSPI, installed once with make program-boot. Copy the versioned mirth or mirth_lite .bin
  from the release to the root of a card with one FAT32 partition of 2 GB or less, copy the contents of the card zip
  beside it, and power-cycle.
brick_risk: false
tags: [fx, neural-network, synth-engine, open-source]
