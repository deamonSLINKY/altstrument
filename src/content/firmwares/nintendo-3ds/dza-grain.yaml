device: nintendo-3ds
name: DZA.grain (3DS)
summary: Paid granular sampler for the Nintendo 3DS by Light Reft, with grain controls, microphone sampling, touch-screen operation, its own effects and a morph automation slider.
description: >-
  DZA.grain is a granular sampler engine adapted to the 3DS's hardware. It has grain speed and density controls, shows
  the active grains on the waveforms, and takes samples by import or by recording through the built-in microphones. It
  uses both screens, the stylus and the circle pad. Compared with the PSP version it adds its own effects and a slider
  for morph automation. It is independent homebrew by the artist DZA, the Light Reft project and the HOW2MAKE RECORDS
  label, and is not affiliated with Nintendo. The 3DS version was added to the same Bandcamp release as the PSP version
  and is a free download for people who already have that version. Synth Anatomy names only the 3DS, and the Bandcamp page does not
  say whether the 2DS family or the New models are required or supported. No source is published and the page states
  all rights reserved.
status: active
authors:
