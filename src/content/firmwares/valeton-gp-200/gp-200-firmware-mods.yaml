device: valeton-gp-200
name: GP-200 Firmware Mods
summary: >-
  Browser configurator that builds a modified GP-200 firmware from your own stock V1.8.0 or V1.8.2 image:
  DSP load readout, dual chains, scenes, preset trails, universal effect blocks, native NAM A2 Lite amps
  with a live loader, and replacement SnapTones and IRs.
description: >-
  Rights warning: since 2026-10-30 the repository also holds BIN/Custom 0.6.1_NAM_0.bin, a 6.5 MB firmware
  image that the README does not mention. It was not downloaded or opened for this entry, but by its name and
  size it is a build of Valeton's firmware, which Valeton does not license for redistribution. Prefer building
  your own image from the configurator.

  The main route is the configurator, an offline HTML page (version 0.6.1). You load your own unmodified
  BIN, tick the mods you want and download a ZIP with the generated firmware and a manifest. The mods are a
  DSP load percentage at the top of the screen, a Dual Chain mode with two paths, a blend control, sample
  alignment and a polarity switch for the second path, a Scenes mode with four snapshots per preset on top
  of the saved preset, trails when switching patches, universal blocks that can each hold an effect from a
  family chosen on the pedal, replacement effects, SnapTone replacements, replacement IRs and native NAM A2
  Lite amp models. A separate page, GP200_Load_NAM_EN.html, loads up to 32 NAM A2 models into a pedal that
  runs the modified firmware, over MIDI. The custom features are edited only on the pedal, because
  Valeton's editor does not support them, and a NAM model takes about 55% of the DSP budget, so the author
  lists effects to leave out of a patch that uses one.

  Version 0.6.1 corrects a bug in activating the drums. The repository root has the configurator and the NAM
  loader page, and earlier configurator versions are in an _OLD folder. The page says it is experimental and
  unofficial.

  The README credits tntexplosivesltd, author of gp200-patcher, for the reverse engineering it builds on.
  The configurator is a single bundled HTML file, not readable source, and the repository holds no
  separate source for the patches. It targets the GP-200 only; the GP-200LT is not mentioned.
status: active
authors:
- name: Goaltoday
  url: https://github.com/Goaltoday
source: https://github.com/Goaltoday/GP-200-FIRMWARE-MODS
source_status: patcher-only
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GNU GPL version 3 text, with no "or later" statement in the README or the
  configurator page. It covers the author's own work only; Valeton's firmware is not licensed for
  redistribution, and the prebuilt image in the BIN folder was not opened, so its terms are unchecked.
distribution: patch-your-own
requires_stock: GP-200 (also GP-200R and GP-200X) V1.8.0 or V1.8.2, or an image the configurator already modified
install_notes: >-
  Open Custom_Firmware_0.6.1.html from the repository in a desktop browser, load your own unmodified
  firmware BIN, choose and configure the mods, and build. Unzip the result, read the manifest and flash
  the BIN with Valeton's official update procedure for your version; do not interrupt the update. Copy the
  replacement files listed in the ZIP into Valeton's editor only if the manifest says to, after backing
  up the originals. Back up your presets first. The author calls the project experimental and beta.
brick_risk: false
